[project]
name = "fr-drill"
version = "0.1.0"
description = "French A1 drill and DELF-style exam trainer"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = ["pypdf"]

[project.optional-dependencies]
rag = ["fastembed>=0.9", "qdrant-client>=1.20"]

[project.scripts]
fr-drill = "fr_drill.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy", "pytest", "qdrant-client>=1.20", "ruff", "ty"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

# Every variable, parameter and return value is typed. ty is the reference checker;
# tests/test_annotations.py covers variables, which no checker requires.
[tool.mypy]
strict = true
files = ["src", "tests"]
